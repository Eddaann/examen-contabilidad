services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examen_local}
      POSTGRES_DB: ${POSTGRES_DB:-examen_contabilidad}
    ports:
      - "127.0.0.1:${DB_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_create_identity.sql:/docker-entrypoint-initdb.d/001_create_identity.sql:ro
      - ./database/migrations/002_create_exams.sql:/docker-entrypoint-initdb.d/002_create_exams.sql:ro
      - ./database/migrations/003_create_attempts.sql:/docker-entrypoint-initdb.d/003_create_attempts.sql:ro
      - ./database/migrations/004_preserve_attempt_results.sql:/docker-entrypoint-initdb.d/004_preserve_attempt_results.sql:ro
      - ./database/migrations/005_create_auth_sessions.sql:/docker-entrypoint-initdb.d/005_create_auth_sessions.sql:ro
      - ./database/migrations/006_create_auth_rate_limits.sql:/docker-entrypoint-initdb.d/006_create_auth_rate_limits.sql:ro
      - ./database/migrations/007_preserve_attempt_texts.sql:/docker-entrypoint-initdb.d/007_preserve_attempt_texts.sql:ro
      - ./database/seeds/001_roles_permissions.sql:/docker-entrypoint-initdb.d/008_roles_permissions.sql:ro
      - ./database/seeds/002_test_data.sql:/docker-entrypoint-initdb.d/009_test_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en el archivo .env}
      TEST_STUDENT_PASSWORD: ${TEST_STUDENT_PASSWORD:?Configura TEST_STUDENT_PASSWORD en el archivo .env}
      TEST_TEACHER_PASSWORD: ${TEST_TEACHER_PASSWORD:?Configura TEST_TEACHER_PASSWORD en el archivo .env}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-examen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examen_local}
      POSTGRES_DB: ${POSTGRES_DB:-examen_contabilidad}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/db').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
